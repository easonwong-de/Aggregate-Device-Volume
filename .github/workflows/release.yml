name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build and Release
        runs-on: macos-latest
        permissions:
            contents: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Build AggregateVolumeMenu
              run: |
                  xcodebuild clean build \
                    -project AggregateVolumeMenu.xcodeproj \
                    -scheme AggregateVolumeMenu \
                    -configuration Release \
                    -derivedDataPath ./build/derivedData \
                    CONFIGURATION_BUILD_DIR=./build/output \
                    CODE_SIGN_IDENTITY="-" \
                    CODE_SIGNING_REQUIRED=NO

            - name: Create ZIP archive
              run: |
                  cd ./build/output
                  zip -qry ../AggregateVolumeMenu.zip "Aggregate Device Volume.app"

            - name: Compute SHA-256
              run: |
                  shasum -a 256 ./build/AggregateVolumeMenu.zip > ./build/AggregateVolumeMenu.zip.sha256
                  cat ./build/AggregateVolumeMenu.zip.sha256

            - name: Create Release and Upload Assets
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  VERSION=$(awk -F '=' '/MARKETING_VERSION/ {gsub(/[ ;]/, "", $2); print $2; exit}' AggregateVolumeMenu.xcodeproj/project.pbxproj)
                  TAG="v${VERSION}"

                  if gh release view "${TAG}" >/dev/null 2>&1; then
                      echo "Release ${TAG} already exists. Uploading assets..."
                      gh release upload "${TAG}" \
                          ./build/AggregateVolumeMenu.zip \
                          ./build/AggregateVolumeMenu.zip.sha256 \
                          --clobber
                  else
                      echo "Creating release ${TAG}..."
                      gh release create "${TAG}" \
                          ./build/AggregateVolumeMenu.zip \
                          ./build/AggregateVolumeMenu.zip.sha256 \
                          --title "${TAG}" \
                          --generate-notes
                  fi
