name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build and Release
        runs-on: macos-latest
        permissions:
            contents: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Build AggregateVolumeMenu
              run: |
                  xcodebuild clean build \
                    -project AggregateVolumeMenu.xcodeproj \
                    -scheme AggregateVolumeMenu \
                    -configuration Release \
                    -derivedDataPath ./build/derivedData \
                    CONFIGURATION_BUILD_DIR=./build/output \
                    CODE_SIGN_IDENTITY="-" \
                    CODE_SIGNING_REQUIRED=NO

            - name: Create ZIP archive
              run: |
                  cd ./build/output
                  zip -qry ../AggregateVolumeMenu.zip "Aggregate Device Volume.app"

            - name: Compute SHA-256
              run: |
                  shasum -a 256 ./build/AggregateVolumeMenu.zip > \
                      ./build/AggregateVolumeMenu.zip.sha256
                  cat ./build/AggregateVolumeMenu.zip.sha256
                  SHA256=$(awk '{print $1}' \
                      ./build/AggregateVolumeMenu.zip.sha256)
                  echo "SHA256=${SHA256}" >> "$GITHUB_ENV"

            - name: Create Release and Upload Assets
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  VERSION=$(awk -F '=' '/MARKETING_VERSION/ {gsub(/[ ;]/, "", $2); print $2; exit}' \
                      AggregateVolumeMenu.xcodeproj/project.pbxproj)
                  echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
                  TAG="v${VERSION}"

                  if gh release view "${TAG}" >/dev/null 2>&1; then
                      echo "Release ${TAG} already exists. Uploading assets..."
                      gh release upload "${TAG}" \
                          ./build/AggregateVolumeMenu.zip \
                          ./build/AggregateVolumeMenu.zip.sha256 \
                          --clobber
                  else
                      echo "Creating release ${TAG}..."
                      gh release create "${TAG}" \
                          ./build/AggregateVolumeMenu.zip \
                          ./build/AggregateVolumeMenu.zip.sha256 \
                          --title "${TAG}" \
                          --generate-notes
                  fi

            - name: Checkout Homebrew tap
              uses: actions/checkout@v7
              with:
                  repository: easonwong-de/homebrew-tap
                  token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
                  path: homebrew-tap

            - name: Update Homebrew Cask
              run: |
                  cask_file="homebrew-tap/Casks/aggregate-volume-menu.rb"

                  sed -E \
                      -e "s/version [\"'].*[\"']/version \"${VERSION}\"/" \
                      -e "s/sha256 (:no_check|[\"'].*[\"'])/sha256 \"${SHA256}\"/" \
                      "$cask_file" > "${cask_file}.tmp"
                  mv "${cask_file}.tmp" "$cask_file"

                  cd homebrew-tap
                  git config user.name "github-actions[bot]"
                  git config user.email \
                      "github-actions[bot]@users.noreply.github.com"

                  if ! git diff --quiet -- Casks/aggregate-volume-menu.rb; then
                      git add Casks/aggregate-volume-menu.rb
                      git commit -m \
                          "chore(cask): update aggregate-volume-menu to ${VERSION}"
                      git push origin HEAD:main
                  else
                      echo "Cask is already up to date."
                  fi
